name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint:all

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        env:
          MAWM_RELEASE_HOOK: "true"
        run: bun run test

      - name: Build
        run: bun run build

      - name: Check bootstrap release tag
        id: bootstrap
        run: |
          if git rev-parse --verify "refs/tags/v0.1.0" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.bootstrap.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      - name: Await manual v0.1.0 bootstrap
        if: steps.bootstrap.outputs.ready != 'true'
        run: >-
          printf '%s\n' 'Skipping semantic-release until the manual v0.1.0 tag exists on main.'
